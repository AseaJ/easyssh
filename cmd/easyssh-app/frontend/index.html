<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>go-zs 证书托管</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>go-zs 证书托管</h1>
      <nav class="tabs">
        <button class="tab active" data-view="overview">概览</button>
        <button class="tab" data-view="config">配置</button>
        <button class="tab" data-view="notify">通知</button>
        <button class="tab" data-view="logs">日志</button>
      </nav>
      <div class="actions">
        <button id="btn-scan" class="btn" title="仅检查各证书状态,不会触发续期或部署">立即扫描</button>
        <button id="btn-reload" class="btn ghost">重载配置</button>
        <button id="btn-rebuild" class="btn ghost">重建并重启</button>
        <button id="btn-theme" class="btn ghost icon-btn" title="切换主题" aria-label="切换主题">
          <svg id="icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 2.5v2.2M12 19.3v2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/>
          </svg>
          <svg id="icon-moon" class="hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 概览视图 -->
    <section id="view-overview">
      <div id="overview" class="cards"></div>
      <div class="panel">
        <div class="panel-head">
          <h2>证书列表</h2>
          <span id="last-run" class="muted"></span>
          <div class="actions">
            <button id="btn-export-bundle" class="btn ghost">导出</button>
            <button id="btn-import-bundle" class="btn ghost">导入</button>
          </div>
        </div>
        <div id="cert-list" class="table-wrap"></div>
      </div>
    </section>

    <!-- 配置视图:左侧分类导航 + 右侧内容(mac 风格) -->
    <section id="view-config" class="hidden">
      <div class="panel cfg-layout">
        <aside class="cfg-side">
          <button class="cfg-cat active" data-cat="basic">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 8.98 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 8.98a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01A1.7 1.7 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1.03 1.56h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.06z"/></svg>
            基础设置
          </button>
          <button class="cfg-cat" data-cat="hosts">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg>
            SSH 主机
          </button>
          <button class="cfg-cat" data-cat="certs">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3.5V10c0 5.2-3.4 9.4-8 11-4.6-1.6-8-5.8-8-11V5.5L12 2z"/><path d="M9 11.5l2 2 4-4"/></svg>
            证书配置
          </button>
        </aside>
        <div class="cfg-body">
          <div class="cfg-cat-head">
            <h2 id="cfg-title">基础设置</h2>
            <div class="actions">
              <button id="btn-save-config" class="btn">保存配置</button>
            </div>
          </div>
          <div id="cfg-basic" class="cfg-content"></div>
          <div id="cfg-hosts" class="cfg-content hidden"></div>
          <div id="cfg-certs" class="cfg-content hidden"></div>
        </div>
      </div>
    </section>

    <!-- 通知视图 -->
    <section id="view-notify" class="hidden">
      <div class="panel">
        <div class="panel-head">
          <h2>通知设置</h2>
          <span class="muted">配置推送渠道与触发事件,保存后立即生效</span>
          <div class="actions">
            <button id="btn-test-notify" class="btn ghost">测试发送</button>
            <button id="btn-save-notify" class="btn">保存通知设置</button>
          </div>
        </div>
        <div id="notify-form"></div>
      </div>
    </section>

    <!-- 日志视图 -->
    <section id="view-logs" class="hidden">
      <div class="panel">
        <div class="panel-head">
          <h2>运行日志</h2>
          <div class="actions">
            <button id="btn-copy-logs" class="btn ghost">复制日志</button>
            <button id="btn-clear-logs" class="btn ghost">清空显示</button>
          </div>
        </div>
        <div id="log-list" class="log-box"></div>
      </div>
    </section>

    <div id="toast" class="toast hidden"></div>

    <!-- 导出模态框:勾选范围 + 可选口令,替代 prompt 手动输入 -->
    <div id="export-modal" class="modal-mask hidden">
      <div class="modal">
        <div class="modal-head">
          <h2>导出包</h2>
          <button class="modal-close" data-close-export title="关闭">✕</button>
        </div>
        <p class="modal-sub muted">勾选要打包的内容,导出为 .zsbundle 文件</p>
        <div class="switch-group">
          <label class="switch-row">
            <span class="switch-text">
              <b>配置(config)</b>
              <span class="muted">go-zs.yaml,不含密钥明文(保持 {{env:VAR}} 引用),始终包含</span>
            </span>
            <input type="checkbox" id="exp-config" checked disabled />
            <span class="switch"></span>
          </label>
          <label class="switch-row">
            <span class="switch-text">
              <b>密钥(secrets)</b>
              <span class="muted">环境变量密钥值与 ACME 账号密钥,加密保存,需口令</span>
            </span>
            <input type="checkbox" id="exp-secrets" />
            <span class="switch"></span>
          </label>
          <label class="switch-row">
            <span class="switch-text">
              <b>证书产物(certs)</b>
              <span class="muted">cert.pem / fullchain.pem / chain.pem / privkey.pem</span>
            </span>
            <input type="checkbox" id="exp-certs" />
            <span class="switch"></span>
          </label>
          <label class="switch-row">
            <span class="switch-text">
              <b>SSH 私钥(ssh-keys)</b>
              <span class="muted">配置引用的 SSH 私钥,加密保存,需口令</span>
            </span>
            <input type="checkbox" id="exp-ssh" />
            <span class="switch"></span>
          </label>
        </div>
        <div id="exp-pass-wrap" class="field hidden">
          <label for="exp-pass">导出口令</label>
          <input type="password" id="exp-pass" placeholder="至少 10 字符,非纯数字" autocomplete="new-password" />
          <span class="muted">勾选「密钥」或「SSH 私钥」时必须设置;导入时用同一口令解密</span>
        </div>
        <div class="modal-actions">
          <button class="btn ghost" data-close-export>取消</button>
          <button id="btn-confirm-export" class="btn">导出</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
