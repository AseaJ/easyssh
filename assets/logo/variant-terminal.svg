<?xml version="1.0" encoding="UTF-8"?>
<!--
  easyssh — 备选概念 B:终端提示符 >_ + 盾牌对勾
  表达:通过终端轻松管理证书,安全 + 成功续期。
  (主推方案见 logo-mark.svg:盾牌 + 钥匙 + 续期循环)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="easyssh">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17456F"/>
      <stop offset="1" stop-color="#0A1F38"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#1E9E5A"/>
    </linearGradient>
  </defs>

  <!-- 背景圆角方形 -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg)"/>

  <!-- 终端提示符 >_ (白色) -->
  <g stroke="#F8FAFC" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 188 196 L 240 250 L 188 304"/>
    <path d="M 256 304 L 330 304"/>
  </g>

  <!-- 盾牌(绿)+ 对勾(白):证书安全与成功 -->
  <path d="M 218 358
           Q 218 346 230 346
           L 282 346
           Q 294 346 294 358
           L 294 380
           Q 294 398 276 406
           L 256 414
           L 236 406
           Q 218 398 218 380
           Z"
        fill="url(#shield)"/>
  <path d="M 240 380 L 253 393 L 273 371" stroke="#FFFFFF" stroke-width="11"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
