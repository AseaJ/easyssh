<?xml version="1.0" encoding="UTF-8"?>
<!--
  easyssh — GitHub 仓库横幅 (Banner,1500×500)
  用于 README 顶部 / 仓库封面 / 社交媒体横幅。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="easyssh — Automatic HTTPS certificate management">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1F38"/>
      <stop offset="0.55" stop-color="#123B63"/>
      <stop offset="1" stop-color="#17456F"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DDC97"/>
      <stop offset="1" stop-color="#1E9E5A"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1500" height="500" fill="url(#bg)"/>

  <!-- 装饰:同心圆环(证书链/节点意象,低透明度) -->
  <g fill="none" stroke="#FFFFFF" opacity="0.10">
    <circle cx="1335" cy="95" r="42" stroke-width="2"/>
    <circle cx="1335" cy="95" r="68" stroke-width="2"/>
    <circle cx="1335" cy="95" r="94" stroke-width="1.5"/>
    <circle cx="1245" cy="428" r="26" stroke-width="2"/>
    <circle cx="1245" cy="428" r="48" stroke-width="1.5"/>
    <circle cx="64" cy="432" r="22" stroke-width="2"/>
    <circle cx="64" cy="432" r="40" stroke-width="1.5"/>
  </g>

  <!-- 主图标 -->
  <g transform="translate(140,96) scale(0.6)">
    <rect x="20" y="20" width="472" height="472" rx="118" fill="#F8FAFC" opacity="0.04"/>
    <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg)"/>
    <path d="M 156 172 Q 156 140 188 140 L 324 140 Q 356 140 356 172 L 356 274 Q 356 346 308 380 L 256 414 L 204 380 Q 156 346 156 274 Z" fill="#F8FAFC"/>
    <path d="M 275.4 206.3 A 46 46 0 1 1 236.6 206.3" fill="none" stroke="url(#key)" stroke-width="15" stroke-linecap="round"/>
    <polygon points="256,184 244,206 268,206" fill="#FFFFFF"/>
    <path d="M 256 248 V 368" stroke="url(#key)" stroke-width="20" stroke-linecap="round"/>
    <rect x="266" y="294" width="28" height="14" rx="7" fill="url(#key)"/>
    <rect x="266" y="328" width="22" height="14" rx="7" fill="url(#key)"/>
  </g>

  <!-- 品牌名 -->
  <text x="520" y="265" font-family="'Inter','SF Pro Display','Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="112" font-weight="800" letter-spacing="-2" fill="#FFFFFF">easy</text>
  <text x="852" y="265" font-family="'JetBrains Mono','Cascadia Code','Consolas',monospace"
        font-size="112" font-weight="700" letter-spacing="-2" fill="#4ADE80">ssh</text>

  <!-- 副标题 -->
  <text x="524" y="330" font-family="'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif"
        font-size="34" font-weight="500" fill="#A8C4DC">Automatic HTTPS certificates for your servers</text>
</svg>
